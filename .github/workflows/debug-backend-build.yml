name: debug-backend-build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build
        run: |
          set +e
          npm install > /tmp/npm-install.log 2>&1
          npm run build > /tmp/build.log 2>&1
          code=$?
          cd ..
          echo "BUILD_EXIT_CODE=$code" > debug-build-result.txt
          cat /tmp/build.log >> debug-build-result.txt
          exit $code
      - name: Save build log
        if: always()
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-build-result.txt
          git commit -m "chore: save build diagnostic [build-log]" || true
          git push || true
